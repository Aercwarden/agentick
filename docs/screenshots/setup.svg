<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Agentick setup terminal screenshot">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#15051e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" fill="#05070d"/>
  <rect x="40" y="36" width="880" height="488" rx="18" fill="url(#bg)" stroke="#2a3358"/>
  <circle cx="72" cy="68" r="7" fill="#ff5f57"/><circle cx="96" cy="68" r="7" fill="#ffbd2e"/><circle cx="120" cy="68" r="7" fill="#28c840"/>
  <text x="150" y="73" fill="#7dd3fc" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">agentick - setup</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-variant-ligatures="none">
    <text x="72" y="126" fill="#d1d5db">$ agc setup</text>
    <text x="72" y="170" fill="#ff4fd8" font-weight="700">▰ Agentick agc</text>
    <text x="72" y="204" fill="#e5e7eb">Select provider:</text>
    <text x="72" y="238" fill="#94a3b8">Current model:    (not set)</text>
    <text x="72" y="266" fill="#94a3b8">Active provider:  none</text>
    <text x="72" y="312" fill="#38bdf8">→ (●) OpenAI (API key)</text>
    <text x="72" y="342" fill="#cbd5e1">  (○) OpenAI Codex (OAuth / ChatGPT/Codex account)</text>
    <text x="72" y="372" fill="#cbd5e1">  (○) Google Gemini (API key)</text>
    <text x="72" y="402" fill="#cbd5e1">  (○) xAI / Grok (API key)</text>
    <text x="72" y="456" fill="#a78bfa">↑/↓ navigate · ENTER select · / search · ESC cancel</text>
  </g>
</svg>
