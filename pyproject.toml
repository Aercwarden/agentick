[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agentick"
version = "0.1.0"
description = "Agentick (agc): minimal cyberpunk AI task CLI for reusable prompts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agentick" }]
license = "MIT"
dependencies = ["certifi>=2026.10.23", "rich>=15.0.0"]
keywords = ["ai", "cli", "developer-tools", "prompts", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
  "build>=1.6.1",
  "editables>=0.6",
  "hatchling>=1.32.4",
  "pip>=26.2.2",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
]

[project.scripts]
agc = "agentick.cli:main"
ag = "agentick.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
