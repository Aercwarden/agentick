[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentick"
version = "0.1.0"
description = "Agentick (agc): minimal cyberpunk AI task CLI for reusable prompts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agentick" }]
license = "MIT"
dependencies = ["certifi>=2024.8.30", "rich>=13.9.0"]
keywords = ["ai", "cli", "developer-tools", "prompts", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agc = "agentick.cli:main"
ag = "agentick.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
