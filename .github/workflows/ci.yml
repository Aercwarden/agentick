name: Tests and dependency security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check installed dependency compatibility
        run: uv pip check
      - name: Run tests
        run: uv run --locked --extra dev python -m pytest
      - name: Build distributions with locked build dependencies
        run: uv run --locked --extra dev python -m build --no-isolation
      - name: Audit installed dependencies
        run: uv run --locked --extra dev python -m pip_audit --local --skip-editable
